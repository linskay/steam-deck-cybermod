name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: write

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build backend
        run: cd backend && mvn -B package --file pom.xml

      - name: Test backend
        run: cd backend && mvn -B test

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Build frontend
        run: cd frontend && npm run build

  catalog:
    name: Catalog Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate catalog manifest
        run: |
          jq . catalog/manifest.json > /dev/null
          echo "catalog/manifest.json is valid"

  release:
    name: Create Release
    needs: [backend, frontend, catalog]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build backend
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Get version
        id: version
        run: |
          VERSION=$(date +v%Y.%m.%d-%H%M%S)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create package
        run: |
          mkdir -p package/frontend/dist package/backend package/catalog
          cp -r frontend/dist/* package/frontend/dist/
          cp backend/target/cybermod-backend-1.2.0.jar package/backend/
          cp catalog/manifest.json package/catalog/
          cp scripts/cybermod.sh package/
          cp scripts/cybermod.service package/
          cp scripts/install.sh package/
          chmod +x package/cybermod.sh package/install.sh
          echo "${{ steps.version.outputs.version }}" > package/.version
          tar czf cybermod-${{ steps.version.outputs.version }}-steamdeck.tar.gz -C package .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: cybermod-${{ steps.version.outputs.version }}-steamdeck.tar.gz
          body: |
            ## CyberMod ${{ steps.version.outputs.version }}

            ### Установка на Steam Deck
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/cybermod-${{ steps.version.outputs.version }}-steamdeck.tar.gz -o cybermod.tar.gz
            tar xzf cybermod.tar.gz
            chmod +x install.sh
            ./install.sh
            ```

            После установки CyberMod доступен как systemd-сервис и запускается автоматически.

            ### Обновление
            CyberMod автоматически проверяет наличие обновлений при запуске.
            Для обновления выполните ту же команду установки — она заменит предыдущую версию.
