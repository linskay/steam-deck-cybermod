name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build launcher release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Prepare backend public dir
        run: |
          mkdir -p backend/src/main/resources/public
          rm -rf backend/src/main/resources/public/*
          cp -r frontend/dist/* backend/src/main/resources/public/

      - name: Build backend JAR
        run: |
          cd backend
          mvn -B package

      - name: Prepare release artifact
        run: |
          mkdir -p release
          cp backend/target/cybermod-backend-1.0-SNAPSHOT.jar release/cybermod-launcher.jar
          cp run_on_deck.sh release/run_on_deck.sh
          cp README.md release/README.md
          cp -r catalog release/catalog
          chmod +x release/run_on_deck.sh

          cd release
          sha256sum * > checksums.txt || true
          cd ..

          zip -r cybermod-launcher-linux-x64.zip release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: cybermod-launcher-linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
