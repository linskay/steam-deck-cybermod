name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Prepare Backend Public Dir
        run: |
          rm -rf backend/src/main/resources/public/*
          cp -r frontend/dist/* backend/src/main/resources/public/

      - name: Build Backend JAR
        run: |
          cd backend
          mvn -B package

      - name: Prepare Artifact
        run: |
          mkdir release
          cp backend/target/cybermod-backend-1.0-SNAPSHOT.jar release/cybermod-launcher.jar
          cd release && zip -r ../cybermod-launcher-linux-x64.zip .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: cybermod-launcher-linux-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
