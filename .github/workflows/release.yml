name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  JAVA_VERSION: '21'
  NODE_VERSION: '20'

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'maven'

      - name: Build backend fat JAR
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Upload backend JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/cybermod-backend-1.2.0.jar

  release:
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: package/frontend/dist

      - name: Download backend JAR
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: package/backend

      - name: Copy packaging files
        run: |
          mkdir -p package/catalog
          cp catalog/manifest.json package/catalog/
          cp scripts/cybermod.sh package/
          cp scripts/cybermod.service package/
          cp scripts/install.sh package/
          chmod +x package/cybermod.sh package/install.sh
          echo "${{ github.ref_name }}" > package/.version

      - name: Create release archive
        working-directory: package
        run: |
          tar czf ../cybermod-${{ github.ref_name }}-steamdeck.tar.gz .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cybermod-${{ github.ref_name }}-steamdeck.tar.gz
          body: |
            ## CyberMod ${{ github.ref_name }}

            ### Установка на Steam Deck
            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/cybermod-${{ github.ref_name }}-steamdeck.tar.gz -o cybermod.tar.gz
            tar xzf cybermod.tar.gz
            chmod +x install.sh
            ./install.sh
            ```

            После установки CyberMod доступен как systemd-сервис и запускается автоматически.

            ### Обновление
            CyberMod автоматически проверяет наличие обновлений при запуске.
            Для обновления выполните ту же команду установки — она заменит предыдущую версию.
